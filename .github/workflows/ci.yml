name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate SYNTHETIC data
        run: python -m copilot.data.generate --seed 42 --out data/saas.duckdb
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Train models and log to MLflow
        run: python -m copilot.models.run_all
      - name: Agent eval (offline backend, no API key)
        run: |
          python -m copilot.agent.evaluate --backend offline --golden eval/golden_set.jsonl --no-mlflow
          python -m copilot.agent.evaluate --backend offline --golden eval/holdout_set.jsonl --no-mlflow
