[project]
name = "saas-revenue-copilot"
version = "0.1.0"
description = "SaaS revenue metrics layer, churn/expansion models, and an evaluated LLM analyst agent behind an OAuth2 FastAPI service."
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "lifelines>=0.29",
  "xgboost>=2.0",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "mlflow>=2.14",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyjwt>=2.8",
  "bcrypt>=4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore:.*keyword-only.*"]
